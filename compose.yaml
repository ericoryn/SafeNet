x-application: &application
  image: safenet-kz:release
  build: .
  init: true

services:
  app:
    <<: *application
    environment:
      SAFENET_DB_PATH: /app/data/safenet.sqlite3
    ports:
      - "127.0.0.1:8501:8000"
    volumes:
      - safenet-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/backend/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  safenet-data:
